<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema PAPAS</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #444; background: #2a2a2a; color: white; border-radius: 4px; }
        button { width: 100%; background-color: #0066cc; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0052a3; }
        .toggle-btn { background: none; border: none; color: #28a745; text-decoration: underline; cursor: pointer; display: block; margin: 15px auto 0; font-size: 14px; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="tituloForm">Iniciar Sesión</h2>
        
        <form id="formAuth">
            <div class="form-group" id="grupoNombre" style="display: none;">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div class="form-group" id="grupoRol" style="display: none;">
                <label for="rol">Rol de Usuario:</label>
                <select id="rol">
                    <option value="USER">Usuario Estándar</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <button type="submit" id="btnSubmit">Ingresar</button>
        </form>

        <p id="mensaje"></p>
        <button type="button" class="toggle-btn" id="btnToggle" onclick="alternarModo()">¿No tienes cuenta? Regístrate aquí</button>
    </div>

    <script>
        const API_AUTH = "http://localhost:8080/api/auth";
        let esModoRegistro = false;

        // Si ya hay sesión activa, redirige directo al dashboard
        if (localStorage.getItem("usuarioPapas")) {
            window.location.href = "index.html";
        }

        function alternarModo() {
            esModoRegistro = !esModoRegistro;
            document.getElementById("tituloForm").textContent = esModoRegistro ? "Crear Cuenta" : "Iniciar Sesión";
            document.getElementById("btnSubmit").textContent = esModoRegistro ? "Registrarse" : "Ingresar";
            document.getElementById("btnToggle").textContent = esModoRegistro ? "¿Ya tienes cuenta? Inicia Sesión" : "¿No tienes cuenta? Regístrate aquí";

            document.getElementById("grupoNombre").style.display = esModoRegistro ? "block" : "none";
            document.getElementById("grupoRol").style.display = esModoRegistro ? "block" : "none";

            document.getElementById("mensaje").textContent = "";
            document.getElementById("formAuth").reset();
        }

        document.getElementById("formAuth").addEventListener("submit", async function(e) {
            e.preventDefault();
            const mensajeEl = document.getElementById("mensaje");
            mensajeEl.style.color = "#ffffff";
            mensajeEl.textContent = "Procesando...";

            try {
                if (esModoRegistro) {
                    // REGISTRO
                    const nuevoUsuario = {
                        id: 0,
                        nombre: document.getElementById("nombre").value,
                        email: document.getElementById("email").value,
                        pasword: document.getElementById("password").value, // Se envía 'pasword' para mapear en Java
                        rol: document.getElementById("rol").value
                    };

                    const res = await fetch(`${API_AUTH}/registro`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(nuevoUsuario)
                    });

                    const data = await res.json();

                    if (res.ok && data.status === "success") {
                        mensajeEl.style.color = "#28a745";
                        mensajeEl.textContent = "¡Registro exitoso! Redirigiendo...";
                        setTimeout(alternarModo, 1500);
                    } else {
                        mensajeEl.style.color = "#dc3545";
                        mensajeEl.textContent = data.message || "Error al registrar.";
                    }

                } else {
                    // LOGIN
                    const credenciales = {
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value,
                        pasword: document.getElementById("password").value // Se envían ambas para evitar fallos
                    };

                    const res = await fetch(`${API_AUTH}/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(credenciales)
                    });

                    const data = await res.json();
                    console.log("Respuesta Servidor:", data);

                    if (res.ok && (data.status === "success" || data.usuario || data.id)) {
                        mensajeEl.style.color = "#28a745";
                        mensajeEl.textContent = "¡Inicio correcto! Redirigiendo...";

                        // Guardamos la sesión
                        const usuarioAGuardar = data.usuario ? data.usuario : data;
                        localStorage.setItem("usuarioPapas", JSON.stringify(usuarioAGuardar));

                        // Redirigimos sin usar setTimeout para probar de inmediato
                        window.location.replace("index.html");
                    } else {
                        mensajeEl.style.color = "#dc3545";
                        mensajeEl.textContent = data.message || "Credenciales incorrectas.";
                    }
                }
            } catch (error) {
                console.error("Error en la petición:", error);
                mensajeEl.style.color = "#dc3545";
                mensajeEl.textContent = "Error de conexión o respuesta no válida del servidor.";
            }
        });
    </script>
</body>
</html>
